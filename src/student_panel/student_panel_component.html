@if (addStudent) {
    <add_student (onStuBack)="handleBack()" (onStuExit)="handleExit()"></add_student>
}
@else {
        <h2>Student Panel</h2>
        <input type="image" value="image1">
        <input type="button" value="Add Student" (click)="addStu()">
        <input type="button" value="Exit" (click)="exit()">
}
