<html>
    <body>
        <form>
        <table border>
            <tr>
                <td colspan="3">
                    <b>STUDENT LOGIN</b>
                </td>
            </tr>
            <tr>
                <td>
                    ID:
                </td>
                <td colspan="2">
                    <input type="text"
                    name="id"
                    placeholder="login" 
                    [(ngModel)]="id"/>
                </td>
            </tr>
            <tr>
                <td>
                    PASSWORD:
                </td>
                <td colspan="2">
                    <input type="password"
                    name="password" 
                    placeholder="Enter Password" 
                    [(ngModel)]="password"/>
                </td>
            </tr>
            <tr>
                <td colspan="3" align="center">
                    <input type="button" value="login" (click)="login()" />
                    <input type="reset" value="clear"/>
                </td>
            </tr>
        </table>
        </form>
    </body>
</html>
