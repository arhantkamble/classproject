@if (addStudent) {
    <add_student (onStuBack)=handleBack() (onStuExit)=handleExit()></add_student>
}

@if (takeAttendance){
    <set_attendance (onStuBack)=handleBack() (onStuExit)=handleExit()></set_attendance>
}

@else {
        <h2>Teacher Panel</h2>
        <input type="button" value="Take Attendance" (click)="takeAttend()">
        <input type="button" value="Add Student" (click)="addStu()">
        <input type="button" value="Exit" (click)="exit()">

}
